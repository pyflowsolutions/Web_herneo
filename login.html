<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panel Admin</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f3f4f6; }
        form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
        h2 { margin-top: 0; color: #1f2937; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem 0; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.5rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #error { color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>

<form id="loginForm">
    <h2>Iniciar Sesión</h2>
    <div id="error"></div>
    <label for="username">Usuario</label>
    <input type="text" id="username" required>
    
    <label for="password">Contraseña</label>
    <input type="password" id="password" required>
    
    <button type="submit">Entrar</button>
</form>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (res.ok && data.ok) {
                window.location.href = '/admin.html';
            } else {
                errorDiv.textContent = data.error || 'Credenciales incorrectas';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.textContent = 'Error al conectar con el servidor';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
